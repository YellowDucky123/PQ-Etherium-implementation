[package]
name = "p3_xmss_agg"
version = "0.1.0"
edition = "2024"
description = "Plonky3 uni-stark (AIR over BN254) aggregating k Generalized-XMSS verifications with the Poseidon2-BN254 tweak hash"

[dependencies]
p3_poseidon2_ffi = { path = "../plonky3_ffi" }
p3-air = "0.4.3"
p3-bn254 = "0.4.3"
p3-blake3 = "0.4.3"
p3-challenger = "0.4.3"
p3-commit = "0.4.3"
p3-dft = "0.4.3"
p3-field = "0.4.3"
p3-fri = "0.4.3"
p3-matrix = "0.4.3"
p3-merkle-tree = "0.4.3"
p3-symmetric = "0.4.3"
p3-uni-stark = "0.4.3"
blake3 = "1.5"
num-bigint = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
